<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>ProdKeeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <nav id="nav"></nav>
      <span class="grow"></span>
      <div id="runBox"></div>
      <div id="bellBox"></div>
      <button class="tbtn" data-action="palette" title="Search and commands (Ctrl+K)"></button>
      <button class="tbtn" data-action="lock-now" title="Lock the app"></button>
    </header>
    <main id="main"></main>
  </div>
  <div id="modal" class="overlay" hidden></div>
  <div id="confirm" class="overlay top" hidden></div>
  <div id="palette" class="overlay pal" hidden></div>
  <div id="lock" class="lockscreen" hidden><div id="lockHost"></div></div>
  <div id="toast"></div>
  <script src="util.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
  <script src="tasks.js"></script>
  <script src="daily.js"></script>
  <script src="dnd.js"></script>
  <script src="console.js"></script>
</body>
</html>
