<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>AppWarden</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="content">
      <header id="topbar">
        <nav id="nav"></nav>
        <span class="grow"></span>
        <div id="runBox"></div>
        <div id="fleetBox"></div>
        <div id="bellBox" class="bellwrap"></div>
        <button class="btn icon" data-action="lock-now" title="Lock the app"></button>
      </header>
      <main id="main"></main>
    </div>
  </div>
  <div id="modal" class="overlay" hidden></div>
  <div id="confirm" class="overlay top" hidden></div>
  <div id="lock" class="lockscreen" hidden></div>
  <div id="toast"></div>
  <script src="util.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
  <script src="tasks.js"></script>
  <script src="daily.js"></script>
  <script src="dnd.js"></script>
</body>
</html>
